[package]
name = "egor_render"
version = "0.10.0"
edition = "2024"
authors = ["wick3dr0se <wick3dr0se@protonmail.com>"]
description = "A dead simple 2D wgpu renderer"
license = "MIT"
repository = "https://github.com/wick3dr0se/egor"
keywords = ["egor", "wgpu"]

[features]
default = []
webgl = ["wgpu/webgl"]
angle = ["wgpu/angle"]
gles = ["wgpu/gles"]
vulkan = ["wgpu/vulkan"]

[dependencies]
bytemuck = "1.25.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4"


[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "wgsl",
    "vulkan",
    "gles",
] }
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "wgsl",
    "dx12",
    "vulkan"
] }
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "wgsl",
    "metal",
] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "wgsl",
    "webgpu",
    "webgl",
] }
web-sys = { version = "0.3.104", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
wasm-bindgen = "0.2.127"

[dev-dependencies]
winit = { git = "https://github.com/VoltaSoftware/winit", branch = "lot" }
pollster = "1.0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["noop", "wgsl"] }
